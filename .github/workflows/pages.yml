name: Deploy Work Log
on:
  push:
    branches: [main, ccr-bc1c3867-ybjc2r]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: mkdir _site && cp index.html manifest.json sw.js icon.svg _site/
      - name: Add the latest Android APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp download.html _site/
          gh release download --repo "${{ github.repository }}" --pattern WorkLog.apk --dir _site || echo "no APK yet"
          [ -f _site/WorkLog.apk ] && (cd _site && zip -q WorkLog-apk.zip WorkLog.apk) || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: d
        uses: actions/deploy-pages@v4
