name: Build Expiry Reminder APK
on:
  workflow_dispatch:
  push:
    branches: [main, ccr-9c1dac45-2h2189]
    paths: ['expiry-reminder/**', '.github/workflows/android-expiry.yml']
permissions:
  contents: write
defaults:
  run:
    working-directory: expiry-reminder
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - name: Copy web app
        run: mkdir www && cp index.html parser.js zxing.js manifest.json icon.svg www/
      - run: npx cap add android
      - name: Android permissions (camera, notifications, alarms)
        run: |
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          add = '''
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.USE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
          '''
          s = s.replace('</manifest>', add + '</manifest>')
          open(p, 'w').write(s)
          PY
      - name: App icon (optional)
        continue-on-error: true
        run: |
          sudo apt-get install -y librsvg2-bin
          mkdir -p assets
          rsvg-convert -w 1024 -h 1024 icon.svg -o assets/icon-only.png
          npm install --no-save @capacitor/assets
          npx capacitor-assets generate --android --iconBackgroundColor '#17212b' --iconBackgroundColorDark '#17212b'
      - name: Use the fixed signing key and a rising version number
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set - using a temporary key, updates will not install over older builds"
          fi
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: expiry-reminder/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ExpiryReminder.apk
          gh release create "expiry-apk-${{ github.run_number }}" ExpiryReminder.apk --title "Expiry Reminder Android build ${{ github.run_number }}" --notes "Download ExpiryReminder.apk on an Android phone and install it." --latest=false
