name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, ccr-bc1c3867-ybjc2r]
    paths: [index.html, manifest.json, icon.svg, capacitor.config.json, package.json, .github/workflows/android.yml]
permissions:
  contents: write
  actions: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - name: Copy web app
        run: mkdir www && cp index.html manifest.json icon.svg www/
      - run: npx cap add android
      - name: App icon (optional)
        continue-on-error: true
        run: |
          sudo apt-get install -y librsvg2-bin
          mkdir -p assets
          rsvg-convert -w 1024 -h 1024 icon.svg -o assets/icon-only.png
          npm install --no-save @capacitor/assets
          npx capacitor-assets generate --android --iconBackgroundColor '#6c5ce7' --iconBackgroundColorDark '#6c5ce7'
      - name: Use the fixed signing key and a rising version number
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Using the fixed signing key"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set - using a temporary key, updates will not install over older builds"
          fi
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk WorkLog.apk
          gh release create "apk-${{ github.run_number }}" WorkLog.apk --title "Work Log Android build ${{ github.run_number }}" --notes "Download WorkLog.apk on an Android phone and install it." --latest
      - name: Refresh the website so it serves this APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref "${{ github.ref_name }}"
