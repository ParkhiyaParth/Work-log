name: Build Shelf Scan APK
on:
  workflow_dispatch:
  push:
    branches: [main, ccr-323dcf13-6taa0w]
    paths: [shelf/**, .github/workflows/shelf-android.yml]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Capacitor project
        run: |
          mkdir app && cd app
          npm init -y >/dev/null
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @zxing/library@0.21.3
          mkdir www
          cp ../shelf/index.html ../shelf/manifest.json ../shelf/icon.svg www/
          cp node_modules/@zxing/library/umd/index.min.js www/zxing.min.js
          cat > capacitor.config.json <<'JSON'
          {"appId":"com.shelfscan.app","appName":"Shelf Scan","webDir":"www","backgroundColor":"#1b1418"}
          JSON
          npx cap add android
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application#' android/app/src/main/AndroidManifest.xml
      - name: App icon (optional)
        continue-on-error: true
        working-directory: app
        run: |
          sudo apt-get install -y librsvg2-bin
          mkdir -p assets
          rsvg-convert -w 1024 -h 1024 ../shelf/icon.svg -o assets/icon-only.png
          npm install --no-save @capacitor/assets
          npx capacitor-assets generate --android --iconBackgroundColor '#7a1f3d' --iconBackgroundColorDark '#7a1f3d'
      - name: Signing key and version number
        working-directory: app
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          fi
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
      - working-directory: app
        run: npx cap sync android
      - name: Build debug APK
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/android/app/build/outputs/apk/debug/app-debug.apk ShelfScan.apk
          gh release create "shelf-apk-${{ github.run_number }}" ShelfScan.apk --title "Shelf Scan Android build ${{ github.run_number }}" --notes "Download ShelfScan.apk on an Android phone and install it."
