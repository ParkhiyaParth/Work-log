<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7a1f3d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Shelf Scan">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>Shelf Scan</title>
<style>
:root{--bg:#f6f1ea;--card:#fffdf9;--ink:#26191e;--mute:#7d6d73;--line:#e6dccf;--accent:#7a1f3d;--on-accent:#fff;--ok:#2f7d4f;--warn:#b4631a;--warn-bg:#fbeedd;--ok-bg:#e3f2e8}
@media (prefers-color-scheme:dark){:root{--bg:#1b1418;--card:#261c21;--ink:#f3e9ea;--mute:#a8969c;--line:#3a2c33;--accent:#d9587f;--on-accent:#1b1418;--ok:#6cc790;--warn:#f0a35e;--warn-bg:#3a2815;--ok-bg:#16301f}}
*{box-sizing:border-box}
[hidden]{display:none!important}
input[type=number]{-moz-appearance:textfield;appearance:textfield}input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:84px;-webkit-tap-highlight-color:transparent}
main{max-width:560px;margin:0 auto;padding:16px 16px 24px}
h1{font-size:22px;margin:0 0 14px;letter-spacing:-.01em}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:22px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
label{display:block;font-size:13px;color:var(--mute);margin:0 0 4px}
input{width:100%;font:inherit;font-size:18px;padding:12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
input:focus,button:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:14px 16px;background:var(--accent);color:var(--on-accent);cursor:pointer;min-height:48px}
button.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
button.warn{background:var(--warn);color:#fff}
button.small{padding:8px 12px;min-height:36px;font-size:14px}
button:disabled{opacity:.45}
.row{display:flex;gap:8px}
.row>*{min-width:0}
.row input{flex:1}
.stack{display:grid;gap:12px}
.name{font-size:24px;font-weight:700;letter-spacing:-.01em;overflow-wrap:anywhere}
.code{font:13px ui-monospace,Menlo,monospace;color:var(--mute)}
.qty{display:flex;align-items:center;gap:10px}
.qty input{text-align:center;font-size:30px;font-weight:700;width:100%}
.qty button{width:56px;font-size:26px;padding:0;flex:none}
.hint{font-size:13px;color:var(--mute)}
video{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;background:#000;display:block}
.scanwrap{position:relative}
.scanwrap::after{content:"";position:absolute;left:12%;right:12%;top:50%;height:2px;background:var(--accent);box-shadow:0 0 12px var(--accent)}
.list{display:grid;gap:8px}
.item{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:600;overflow-wrap:anywhere}
.badge{font-weight:700;border-radius:999px;padding:3px 10px;font-size:14px;white-space:nowrap}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.item.done .t{text-decoration:line-through;color:var(--mute)}
.chk{width:28px;height:28px;flex:none;accent-color:var(--accent)}
.empty{color:var(--mute);text-align:center;padding:22px 8px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;color:var(--mute);border-radius:0;min-height:60px;font-size:13px;position:relative}
nav button[aria-selected=true]{color:var(--accent)}
nav .n{position:absolute;top:6px;margin-left:6px;background:var(--warn);color:#fff;border-radius:999px;font-size:11px;padding:1px 6px}
.thumb{width:56px;height:56px;border-radius:10px;object-fit:cover;flex:none;background:var(--line)}
.thumb.ph{display:grid;place-items:center;color:var(--mute);font-size:22px}
.hero{width:100%;max-height:220px;object-fit:contain;border-radius:12px;background:var(--bg)}
.newbanner{background:var(--accent);color:var(--on-accent);border-radius:12px;padding:12px 14px;font-weight:700;font-size:18px}
.newbanner small{display:block;font-weight:500;font-size:14px;opacity:.9;margin-top:2px}
.photoRow{display:flex;align-items:center;gap:12px}
.photoRow input[type=file]{display:none}
/* polish */
:root{--shadow:0 1px 2px rgba(60,20,35,.06),0 6px 18px rgba(60,20,35,.07);--ease:cubic-bezier(.2,.8,.2,1)}
@media (prefers-color-scheme:dark){:root{--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3)}}
body{padding-top:0}
.appbar{background:linear-gradient(135deg,#7a1f3d,#a8325a);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 22px;border-radius:0 0 24px 24px;box-shadow:var(--shadow)}
.appbar .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
.appbar img{width:40px;height:40px;border-radius:11px;flex:none}
.appbar b{font-size:20px;letter-spacing:-.01em;display:block}
.appbar span{font-size:13px;opacity:.85}
.stats{margin-left:auto;display:flex;gap:8px}
.stat{background:rgba(255,255,255,.16);border-radius:12px;padding:6px 12px;text-align:center;min-width:58px}
.stat i{font-style:normal;font-weight:800;font-size:18px;display:block;line-height:1.1}
.stat u{text-decoration:none;font-size:11px;opacity:.85}
main{margin-top:-8px}
h1{display:none}
.card{box-shadow:var(--shadow);border-radius:18px}
button{transition:transform .12s var(--ease),filter .15s,background .2s;-webkit-user-select:none;user-select:none}
button:active:not(:disabled){transform:scale(.96);filter:brightness(.92)}
input{transition:border-color .2s,box-shadow .2s}
input:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent);outline:none}
#done,#take,#saveNew{min-height:56px;font-size:17px;border-radius:14px}
#done{background:var(--ok);color:#fff}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes sweep{0%{top:12%}50%{top:88%}100%{top:12%}}
@keyframes slideIn{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
section,#found,#newp,#scanCard,#camBox,#todayBox{animation:rise .32s var(--ease) both}
.item{animation:slideIn .28s var(--ease) both;box-shadow:var(--shadow);border-radius:14px}
.item:nth-child(2){animation-delay:.04s}.item:nth-child(3){animation-delay:.08s}.item:nth-child(4){animation-delay:.12s}.item:nth-child(5){animation-delay:.16s}.item:nth-child(n+6){animation-delay:.2s}
.bump{animation:pop .22s var(--ease)}
.newbanner{background:linear-gradient(135deg,#7a1f3d,#b8396a);color:#fff;animation:pop .45s var(--ease)}
.scanwrap{border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.scanwrap video{border-radius:0}
.scanwrap::after{left:12%;right:12%;top:12%;height:2px;animation:sweep 2.2s ease-in-out infinite;border-radius:2px}
.scanwrap::before{content:"";position:absolute;inset:14% 10%;border:3px solid rgba(255,255,255,.85);border-radius:16px;z-index:1;pointer-events:none;clip-path:polygon(0 0,28% 0,28% 3px,3px 3px,3px 28%,0 28%,0 0,100% 0,100% 28%,calc(100% - 3px) 28%,calc(100% - 3px) 3px,72% 3px,72% 0,100% 0,100% 100%,72% 100%,72% calc(100% - 3px),calc(100% - 3px) calc(100% - 3px),calc(100% - 3px) 72%,100% 72%,100% 100%,0 100%,0 72%,3px 72%,3px calc(100% - 3px),28% calc(100% - 3px),28% 100%,0 100%)}
.scanwrap::after{z-index:1}
.thumb{box-shadow:0 1px 3px rgba(0,0,0,.18)}
.hero{animation:pop .4s var(--ease)}
nav{background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 -6px 20px rgba(60,20,35,.08)}
nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 0;font-size:12px;transition:color .2s}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s var(--ease)}
nav button[aria-selected=true] svg{transform:translateY(-2px) scale(1.12)}
nav button[aria-selected=true]::before{content:"";position:absolute;top:0;width:34px;height:3px;border-radius:0 0 4px 4px;background:var(--accent);animation:pop .3s var(--ease)}
nav .n{top:4px;margin-left:0;left:calc(50% + 6px)}
.toast{animation:toastIn .25s var(--ease) both;box-shadow:var(--shadow)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:5;max-width:90%}
</style>
</head>
<body>
<header class="appbar"><div class="in">
  <img src="icon.svg" alt="">
  <div><b>Shelf Scan</b><span id="dateLbl"></span></div>
  <div class="stats">
    <div class="stat"><i id="stDone">0</i><u>done</u></div>
    <div class="stat"><i id="stPick">0</i><u>to fetch</u></div>
  </div>
</div></header>
<main>
  <section id="tab-shelve">
    <h1>Shelve</h1>
    <div class="stack">
      <div id="camBox" hidden class="stack">
        <div class="scanwrap"><video id="vid" playsinline muted></video></div>
        <button class="ghost" id="camStop">Stop camera</button>
      </div>
      <div class="card stack" id="scanCard">
        <div>
          <label for="code">Barcode or product name</label>
          <div class="row">
            <input id="code" autocomplete="off" placeholder="Scan barcode or type name">
            <button id="camStart" aria-label="Scan with camera">Scan</button>
          </div>
          <p class="hint" id="camMsg" style="margin:6px 0 0"></p>
        </div>
        <div class="list" id="matches"></div>
        <button class="ghost" id="noBarcode">Product has no barcode? Add it by name</button>
      </div>

      <div id="found" hidden class="card stack">
        <img id="fPhoto" class="hero" alt="" hidden>
        <div><div class="name" id="fName"></div><div class="code" id="fCode"></div></div>
        <div>
          <label for="qty">Quantity still needed after shelving</label>
          <div class="qty">
            <button class="ghost" id="minus" aria-label="Less">−</button>
            <input id="qty" type="number" inputmode="numeric" min="0" value="0">
            <button class="ghost" id="plus" aria-label="More">+</button>
          </div>
          <p class="hint" style="margin:6px 0 0">0 means the shelf is full.</p>
        </div>
        <button id="done">Shelf is full, next item</button>
        <button id="take" class="warn" hidden>Take from storage</button>
        <button class="ghost" id="cancelFound">Cancel</button>
      </div>

      <div id="newp" hidden class="card stack">
        <div class="newbanner" id="nBanner">New product<small id="nSub"></small></div>
        <div>
          <label for="nName">Product name</label>
          <input id="nName" autocomplete="off" placeholder="e.g. Royal Stag 750 ml">
        </div>
        <div class="photoRow">
          <img id="nImg" class="thumb ph" alt="" hidden>
          <label class="ghost" for="nFile" style="margin:0;padding:12px 16px;border:1.5px solid var(--line);border-radius:12px;font-weight:600;color:var(--ink);font-size:16px">Take product photo</label>
          <input id="nFile" type="file" accept="image/*" capture="environment">
        </div>
        <button id="saveNew">Save product and enter quantity</button>
        <button class="ghost" id="cancelNew">Cancel</button>
      </div>

      <div id="todayBox">
        <h2>Done today</h2>
        <div class="list" id="todayList"></div>
      </div>
    </div>
  </section>

  <section id="tab-storage" hidden>
    <h1>From storage</h1>
    <p class="hint">Bottles you still need to bring from the back. Tick each when it is on the shelf.</p>
    <div class="list" id="pickList"></div>
    <div class="row" style="margin-top:14px"><button class="ghost" id="clearDone">Clear ticked</button></div>
  </section>

  <section id="tab-products" hidden>
    <h1>Products</h1>
    <div class="card stack">
      <div><label for="pCode">Barcode (leave empty if none)</label><input id="pCode" inputmode="numeric" autocomplete="off"></div>
      <div><label for="pName">Product name</label><input id="pName" autocomplete="off"></div>
      <div class="photoRow">
        <img id="pImg" class="thumb ph" alt="" hidden>
        <label class="ghost" for="pFile" style="margin:0;padding:12px 16px;border:1.5px solid var(--line);border-radius:12px;font-weight:600;color:var(--ink);font-size:16px">Product photo</label>
        <input id="pFile" type="file" accept="image/*" capture="environment">
      </div>
      <button id="pSave">Add or update product</button>
    </div>
    <h2>Saved products <span id="pCount"></span></h2>
    <input id="pFilter" placeholder="Search name or barcode" autocomplete="off" style="margin-bottom:8px">
    <div class="list" id="pList"></div>
    <h2>Backup</h2>
    <div class="card stack">
      <p class="hint" style="margin:0">Your data lives only on this phone. Copy a backup now and then.</p>
      <div class="row"><button class="ghost" id="exp">Copy backup</button><button class="ghost" id="imp">Restore backup</button></div>
      <textarea id="bk" rows="4" style="width:100%;font:12px ui-monospace,monospace;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);padding:8px" placeholder="Paste a backup here, then press Restore backup"></textarea>
    </div>
  </section>
</main>

<nav role="tablist">
  <button role="tab" data-tab="shelve" aria-selected="true"><svg viewBox="0 0 24 24"><path d="M4 7V5h3M17 5h3v2M20 17v2h-3M7 19H4v-2M4 12h16"/></svg>Shelve</button>
  <button role="tab" data-tab="storage" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M3 8l9-5 9 5v10l-9 4-9-4zM3 8l9 5 9-5M12 13v9"/></svg>Storage<span class="n" id="pickN" hidden></span></button>
  <button role="tab" data-tab="products" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M9 3h6v4l2 3v11H7V10l2-3zM7 14h10"/></svg>Products</button>
</nav>

<script>
const $ = id => document.getElementById(id);
const KEY = 'shelfscan-v1';
let db = { products: {}, picks: [], today: { date: '', items: [] } };
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.products) db = s; } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { toast('Could not save on this phone'); } };
const day = () => new Date().toLocaleDateString('en-CA');
function rollDay() { if (db.today.date !== day()) { db.today = { date: day(), items: [] }; save(); } }
let cur = null;

function toast(m) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 1800); }
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };

/* tabs */
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.setAttribute('aria-selected', x === b));
  ['shelve', 'storage', 'products'].forEach(t => $('tab-' + t).hidden = t !== b.dataset.tab);
  if (b.dataset.tab !== 'shelve') stopCam();
  render();
});

/* helpers */
const NB = 'NB-';
const hasCode = c => !c.startsWith(NB);
const newId = () => NB + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
function thumb(src) { if (src) { const i = el('img', 'thumb'); i.src = src; i.alt = ''; return i; } return el('div', 'thumb ph', '🍾'); }
function readPhoto(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const k = Math.min(1, 480 / Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.72));
    };
    im.onerror = () => { URL.revokeObjectURL(url); rej(); };
    im.src = url;
  });
}
function bindPhoto(fileId, imgId, set) {
  $(fileId).onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try { const d = await readPhoto(f); set(d); const i = $(imgId); i.src = d; i.hidden = false; } catch (x) { toast('Could not read that photo'); }
    e.target.value = '';
  };
}
let newPhoto = '', newKey = '', prodPhoto = '', editKey = '';
bindPhoto('nFile', 'nImg', d => newPhoto = d);
bindPhoto('pFile', 'pImg', d => prodPhoto = d);

/* lookup */
function resetShelve() {
  cur = null; newKey = ''; newPhoto = '';
  $('found').hidden = $('newp').hidden = true; $('scanCard').hidden = false;
  $('code').value = ''; $('matches').textContent = '';
}
function showFound(key) {
  const p = db.products[key]; cur = key;
  $('scanCard').hidden = true; $('newp').hidden = true;
  $('fName').textContent = p.name; $('fCode').textContent = hasCode(key) ? key : 'No barcode';
  const ph = $('fPhoto'); ph.hidden = !p.photo; if (p.photo) ph.src = p.photo;
  $('qty').value = 0; updQty(); $('found').hidden = false;
  window.scrollTo({ top: 0 });
  setTimeout(() => { $('qty').focus(); $('qty').select(); }, 50);
}
function showNew(code) {
  newKey = code || newId(); newPhoto = '';
  $('scanCard').hidden = true; $('found').hidden = true;
  $('nBanner').firstChild.textContent = code ? 'New product' : 'New product (no barcode)';
  $('nSub').textContent = code ? 'Barcode ' + code + ' is not saved yet. Add the name and a photo.' : 'Enter the name and take a photo so you can find it again.';
  $('nName').value = $('code').value && !code ? $('code').value : '';
  $('nImg').hidden = true; $('newp').hidden = false; window.scrollTo({ top: 0 });
  setTimeout(() => $('nName').focus(), 50);
}
function lookupCode(code) {
  code = String(code || '').trim(); if (!code) return;
  $('code').value = code;
  if (db.products[code]) showFound(code); else showNew(code);
}
function lookup(raw) {
  const q = String(raw || '').trim();
  if (!q) return;
  if (db.products[q] || /^\d+$/.test(q)) return lookupCode(q);
  const hits = searchName(q, true);
  if (!hits.length && !/\s/.test(q) && /\d/.test(q) && q.length >= 6) lookupCode(q);
}
function searchName(q, render) {
  const t = q.toLowerCase();
  const hits = Object.entries(db.products).filter(([c, p]) => p.name.toLowerCase().includes(t)).slice(0, 8);
  if (render) {
    const L = $('matches'); L.textContent = '';
    hits.forEach(([c, p]) => {
      const row = el('button', 'item ghost'); row.style.cssText = 'text-align:left;color:var(--ink);font-weight:600';
      const g = el('div', 'grow', p.name); row.append(thumb(p.photo), g); row.onclick = () => showFound(c); L.appendChild(row);
    });
    if (!hits.length) { const n = el('div', 'empty', 'No saved product called "' + q + '".'); L.appendChild(n); }
  }
  return hits;
}
$('code').addEventListener('input', () => {
  const q = $('code').value.trim();
  if (!q || /^\d+$/.test(q)) { $('matches').textContent = ''; return; }
  searchName(q, true);
});
$('code').addEventListener('keydown', e => { if (e.key === 'Enter') lookup($('code').value); });
$('noBarcode').onclick = () => showNew('');
$('cancelFound').onclick = resetShelve;
$('cancelNew').onclick = resetShelve;
$('saveNew').onclick = () => {
  const n = $('nName').value.trim(); if (!n) return toast('Enter a product name');
  db.products[newKey] = { name: n, photo: newPhoto || '' }; save(); toast('Product saved');
  const k = newKey; newPhoto = ''; showFound(k);
};
$('nName').addEventListener('keydown', e => { if (e.key === 'Enter') $('saveNew').click(); });

/* quantity */
const qv = () => Math.max(0, parseInt($('qty').value, 10) || 0);
function updQty() { const n = qv(); $('take').hidden = n === 0; $('take').textContent = `Take ${n} from storage`; $('done').hidden = n > 0; }
$('qty').oninput = updQty;
$('plus').onclick = () => { $('qty').value = qv() + 1; updQty(); bump($('qty')); };
$('minus').onclick = () => { $('qty').value = Math.max(0, qv() - 1); updQty(); bump($('qty')); };

function finish(inStorage) {
  if (!cur) return; rollDay();
  const n = qv(), name = db.products[cur].name;
  if (inStorage && n > 0) {
    const ex = db.picks.find(p => p.code === cur && !p.done);
    if (ex) ex.qty += n; else db.picks.push({ code: cur, name, qty: n, done: false });
  }
  if (navigator.vibrate) navigator.vibrate(inStorage ? [20, 40, 20] : 30);
  db.today.items.unshift({ code: cur, name, short: inStorage ? n : 0, t: Date.now() });
  save(); toast(inStorage ? `${n} added to storage list` : 'Shelf full');
  resetShelve(); render();
  window.scrollTo({ top: 0 });
}
$('done').onclick = () => finish(false);
$('take').onclick = () => finish(true);

/* camera scanner */
let stream = null, loop = 0, zx = null;
const FORMATS = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39', 'itf'];
function onCode(c) { stopCam(); if (navigator.vibrate) navigator.vibrate(60); lookupCode(c); }
async function startCam() {
  $('camMsg').textContent = '';
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { $('camMsg').textContent = 'Camera needs the https link. You can still type the barcode.'; return; }
  $('camBox').hidden = false;
  const v = $('vid');
  try {
    if ('BarcodeDetector' in window) {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
      v.srcObject = stream; await v.play();
      const det = new BarcodeDetector({ formats: FORMATS });
      const tick = async () => {
        if (!stream) return;
        try { const r = await det.detect(v); if (r.length) return onCode(r[0].rawValue); } catch (e) {}
        loop = setTimeout(tick, 150);
      };
      tick();
    } else {
      await loadZx();
      zx = new ZXing.BrowserMultiFormatReader();
      zx.decodeFromConstraints({ video: { facingMode: { ideal: 'environment' } }, audio: false }, v, (r) => { if (r) onCode(r.getText()); });
    }
  } catch (e) {
    $('camBox').hidden = true;
    $('camMsg').textContent = 'Camera unavailable (' + (e.name || 'error') + '). Allow camera access, or type the barcode.';
  }
}
function loadZx() {
  return new Promise((res, rej) => {
    if (window.ZXing) return res();
    const add = (src, fail) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = fail; document.head.appendChild(s); };
    add('zxing.min.js', () => add('https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js', () => rej(new Error('scanner library offline'))));
  });
}
function stopCam() {
  clearTimeout(loop);
  if (zx) { try { zx.reset(); } catch (e) {} zx = null; }
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  $('vid').srcObject = null; $('camBox').hidden = true;
}
$('camStart').onclick = startCam; $('camStop').onclick = stopCam;

/* storage list */
function renderPicks() {
  const L = $('pickList'); L.textContent = '';
  if (!db.picks.length) L.appendChild(el('div', 'empty', 'Nothing to bring from storage.'));
  db.picks.forEach((p, i) => {
    const row = el('label', 'item' + (p.done ? ' done' : ''));
    const c = el('input', 'chk'); c.type = 'checkbox'; c.checked = p.done; c.style.width = '28px'; c.style.padding = '0';
    c.onchange = () => { p.done = c.checked; save(); renderPicks(); renderBadge(); };
    const g = el('div', 'grow'); g.append(el('div', 't', p.name), el('div', 'code', hasCode(p.code) ? p.code : 'No barcode'));
    row.append(c, thumb((db.products[p.code] || {}).photo), g, el('span', 'badge warn', '× ' + p.qty));
    L.appendChild(row);
  });
}
$('clearDone').onclick = () => { db.picks = db.picks.filter(p => !p.done); save(); render(); };
function renderBadge() { const n = db.picks.filter(p => !p.done).length; $('pickN').hidden = !n; $('pickN').textContent = n; $('stPick').textContent = n; $('stDone').textContent = db.today.items.length; }

/* today */
function renderToday() {
  rollDay(); const L = $('todayList'); L.textContent = '';
  $('todayBox').hidden = !db.today.items.length;
  db.today.items.forEach(it => {
    const row = el('div', 'item'); const g = el('div', 'grow'); g.append(el('div', 't', it.name));
    row.append(thumb((db.products[it.code] || {}).photo), g, it.short ? el('span', 'badge warn', it.short + ' from storage') : el('span', 'badge ok', 'Full'));
    L.appendChild(row);
  });
}

/* products */
function renderProducts() {
  const f = $('pFilter').value.trim().toLowerCase(), L = $('pList'); L.textContent = '';
  const all = Object.entries(db.products).sort((a, b) => a[1].name.localeCompare(b[1].name));
  $('pCount').textContent = '(' + all.length + ')';
  const rows = all.filter(([c, p]) => !f || (hasCode(c) && c.includes(f)) || p.name.toLowerCase().includes(f));
  if (!rows.length) L.appendChild(el('div', 'empty', all.length ? 'No match.' : 'No products yet. Add the first one above, or scan a new barcode on the Shelve tab.'));
  rows.forEach(([c, p]) => {
    const row = el('div', 'item'); const g = el('div', 'grow'); g.append(el('div', 't', p.name), el('div', 'code', hasCode(c) ? c : 'No barcode'));
    const ed = el('button', 'ghost small', 'Edit'); ed.onclick = () => { editKey = c; prodPhoto = ''; $('pCode').value = hasCode(c) ? c : ''; $('pName').value = p.name; const i = $('pImg'); i.hidden = !p.photo; if (p.photo) i.src = p.photo; $('pName').focus(); window.scrollTo({ top: 0 }); };
    const rm = el('button', 'ghost small', 'Delete'); let armed = false;
    rm.onclick = () => { if (!armed) { armed = true; rm.textContent = 'Sure?'; setTimeout(() => { armed = false; rm.textContent = 'Delete'; }, 2500); } else { delete db.products[c]; save(); renderProducts(); } };
    row.append(thumb(p.photo), g, ed, rm); L.appendChild(row);
  });
}
$('pFilter').oninput = renderProducts;
$('pSave').onclick = () => {
  const c = $('pCode').value.trim(), n = $('pName').value.trim();
  if (!n) return toast('Enter a product name');
  const key = c || (editKey && !hasCode(editKey) ? editKey : newId());
  const old = db.products[editKey] || db.products[key] || {};
  db.products[key] = { name: n, photo: prodPhoto || old.photo || '' };
  if (editKey && editKey !== key) delete db.products[editKey];
  save(); editKey = ''; prodPhoto = ''; $('pCode').value = $('pName').value = ''; $('pImg').hidden = true; toast('Saved'); renderProducts();
};

/* backup */
$('exp').onclick = async () => {
  const s = JSON.stringify(db); $('bk').value = s;
  try { await navigator.clipboard.writeText(s); toast('Backup copied'); } catch (e) { $('bk').select(); toast('Select and copy the text'); }
};
$('imp').onclick = () => {
  try {
    const d = JSON.parse($('bk').value);
    if (!d || typeof d.products !== 'object') throw 0;
    db = { products: d.products, picks: d.picks || [], today: d.today || { date: '', items: [] } };
    save(); $('bk').value = ''; toast('Restored'); render();
  } catch (e) { toast('That is not a valid backup'); }
};

$('dateLbl').textContent = new Date().toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'short' });
const bump = e => { e.classList.remove('bump'); void e.offsetWidth; e.classList.add('bump'); if (navigator.vibrate) navigator.vibrate(12); };
function render() { renderToday(); renderPicks(); renderProducts(); renderBadge(); }
render();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
